[project]
name = "comicpro"
version = "0.1.0"
description = "Self-hosted comic reader: multi-source search, online reading, CBZ downloads, local library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<0.29",
    "selectolax>=0.3.21,<0.4",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "aiosqlite>=0.20,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.9,<1",
    "pillow>=10.4,<12",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
