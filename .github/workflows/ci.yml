name: CI and GHCR

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Secrets, backend and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          tools="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$tools/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$tools/checksums.txt"
          (cd "$tools" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$tools/$archive" -C "$tools" gitleaks
          "$tools/gitleaks" git . --log-opts=--all --redact=100 --no-banner

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --frozen --group dev
      - name: Backend lint and tests
        env:
          COMICPRO_MANGAPILL: "0"
          COMICPRO_WEEBCENTRAL: "0"
          COMICPRO_DONGMAN: "0"
          COMICPRO_NHENTAI: "0"
        run: |
          uv run --frozen ruff check backend
          uv run --frozen pytest -q

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend typecheck and production build
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend run build

  container:
    name: Docker build and NAS smoke test
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: comicpro:ci
          cache-from: type=gha,scope=comicpro
          cache-to: type=gha,scope=comicpro,mode=max
      - name: Test Unraid IDs, reader, downloads and restart persistence
        run: |
          docker run -d --name comicpro-ci-smoke \
            -e PUID=99 -e PGID=100 -e COMICPRO_CHECK_INTERVAL_MIN=0 comicpro:ci
          docker exec -i comicpro-ci-smoke python - < scripts/container-smoke.py
          test "$(docker exec comicpro-ci-smoke stat -c '%u:%g' /data/db/comicpro.db)" = '99:100'
          docker restart comicpro-ci-smoke
          docker exec -i comicpro-ci-smoke python - --persisted < scripts/container-smoke.py
      - name: Show container logs on failure
        if: failure()
        run: docker logs comicpro-ci-smoke || true
      - name: Remove test container and its temporary volume
        if: always()
        run: docker rm -fv comicpro-ci-smoke || true

  publish:
    name: Publish amd64 and arm64 to GHCR
    needs: container
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Image tags and source labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.description=Self-hosted comic reader for NAS
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in with the short-lived workflow token
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=comicpro
          cache-to: type=gha,scope=comicpro,mode=max
          provenance: mode=min
          sbom: true
